[mod]
id = "redstonepen"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure two-arm track model (standalone crate lib, injected as
# `crate::game::redstonepen`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "redstonepen"
source = "runtime.rs"

# Game-side glue: the pen click, the signal reads, the dirty sets and the
# level-tick solve.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "redstonepen_state"
source = "support.rs"

# The content half is inside this bundle (`data/redstonepen-content.hmod`, the built
# `content/redstonepen.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the tracks, relays and pen with the code. The registry
# keeps one file per project, so a split port could not be listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Answer a track's stored power on its two ends, or a relay's 15 on its output.
[[injection]]
id = "block-signal"
hook = "block_signal"
hook_version = 1
kind = "HEAD"
helper = "signal.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "face", ty = "Direction", value = "face" },
  { name = "direct", ty = "bool", value = "direct" },
  { name = "signal", ty = "&mut i32", value = "signal" },
]

# Every track and relay is a signal source.
[[injection]]
id = "signal-source"
hook = "is_signal_source"
hook_version = 1
kind = "HEAD"
helper = "source.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "source", ty = "&mut bool", value = "source" },
]

# Neighbour change: queue the track / relay for the next level tick.
[[injection]]
id = "neighbor-changed"
hook = "neighbor_changed"
hook_version = 1
kind = "HEAD"
helper = "neighbor.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
]

# A placed/changed block seeds the first evaluation.
[[injection]]
id = "block-changed"
hook = "block_changed"
hook_version = 1
kind = "HEAD"
helper = "changed.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "new", ty = "BlockStateId", value = "new" },
]

# A placed track takes the player's drawing axis; a relay outputs away from
# the support it was clicked on.
[[injection]]
id = "state-for-placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "state_for_placement.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "answer" },
]

# A pen click draws, extends or erases a track.
[[injection]]
id = "use-item-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

# End of the level tick: apply the queued relays and tracks.
[[injection]]
id = "level-tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]
